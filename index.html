<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi en Direct - Live Track</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #controls { padding: 10px; background: #f5f5f5; display: flex; gap: 10px; align-items: center; }
        #map { flex-grow: 1; width: 100%; }
        input, button { padding: 8px 12px; font-size: 14px; }
        button { background: #2E7D32; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #1b5e20; }
    </style>
</head>
<body>

    <div id="controls">
        <input type="text" id="username" placeholder="Votre Prénom" />
        <button id="startBtn" onclick="toggleTracking()">Démarrer le Start</button>
        <span id="status">Statut : Arrêté</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialisation de la carte Leaflet (Centrée par défaut sur Yverdon-les-Bains)
        var map = L.map('map').setView([46.7785, 6.6412], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let tracking = false;
        let watchId = null;
        let marker = null;

        function toggleTracking() {
            const nameInput = document.getElementById('username').value;
            const btn = document.getElementById('startBtn');
            const status = document.getElementById('status');

            if (!nameInput) {
                alert("Veuillez entrer un prénom !");
                return;
            }

            tracking = !tracking;

            if (tracking) {
                btn.textContent = "Arrêter";
                btn.style.background = "#c62828";
                status.textContent = "Statut : En direct 🟢";
                
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        if (marker) {
                            marker.setLatLng([lat, lng]);
                        } else {
                            marker = L.marker([lat, lng]).addTo(map).bindPopup(nameInput).openPopup();
                        }
                        map.setView([lat, lng], 16);

                        // TODO: Envoyer lat, lng et nameInput vers Firebase Firestore ici
                    }, error => {
                        console.error("Erreur GPS : ", error);
                    }, { enableHighAccuracy: true });
                } else {
                    alert("La géolocalisation n'est pas supportée par votre navigateur.");
                }
            } else {
                btn.textContent = "Démarrer le Start";
                btn.style.background = "#2E7D32";
                status.textContent = "Statut : Arrêté";
                if (watchId) navigator.geolocation.clearWatch(watchId);
            }
        }
    </script>
</body>
</html>
